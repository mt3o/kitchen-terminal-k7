date: "2026-09-25"
title: "Pokaz domowy: zegar czytelny z progu"
items:
  - "W pokazie domowym zegar pokazuje godzinę w największym rozmiarze i na środku ekranu, zamiast małą w rogu karty."
  - "Karta otwarta ręcznie przyciskiem pełnego ekranu wygląda jak dotąd — powiększenie dotyczy tylko kart, które pokaz sam wystawia, gdy nikt nie dotyka ekranu."
