date: "2026-09-15"
title: "Kalendarz: przycisk pełnego ekranu"
items:
  - "Karta kalendarza ma teraz przycisk [ + ] w nagłówku, który powiększa ją na cały ekran; [ x ] zamyka. Jeśli w tym momencie leci pokaz slajdów, zatrzymuje się na czas przeglądania kalendarza i wraca tam, gdzie był, po zamknięciu."
