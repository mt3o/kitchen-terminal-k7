date: "2026-10-05"
title: "Nowy motyw: Kawaii"
items:
  - "Nowy motyw do wyboru — Kawaii: przytulny i słodki, w pastelach. Karty mają tęczową wstążkę i zaokrąglone rogi, a pod każdym tytułem jest cienka tęcza z serduszkami."
  - "Każda karta dostaje losowo jeden z pięciu obrazków: kotek śpiący na chmurce, jednorożec na łące, piknik z babeczką, kotek z balonikami w kształcie serc, kotek na parapecie — i wieczorne wersje w trybie ciemnym. Obrazki rozdawane są jak karty z talii, więc dwie sąsiednie karty rzadko mają ten sam, a nowy zestaw wypada po każdym odświeżeniu strony. Obrazki są tak przygaszone, że każdy napis na nich ma kontrast co najmniej 4,5:1."
  - "W nagłówku siedzi maskotka motywu — biały kotek z rogiem jednorożca. Nocą śpi."
  - "W tle zmieniają się co godzinę obrazki: jednorożec i kotek pod tęczą, rudy kot śpiący na chmurce, kotek na księżycu, jednorożec z kotem pod nocną tęczą, a także wzór z łapek, gwiazdek i serduszek."
  - "Tryb jasny jest różowo-kremowy, ciemny to ten sam świat przed snem — śliwkowe niebo i gwiazdy — a nocny jest jeszcze przygaszony, żeby ekran nie świecił o 3:00. Każdy napis ma kontrast co najmniej 4,5:1 we wszystkich trybach."
  - "Włącza się go tak samo jak inne motywy: z menu w nagłówku albo `theme: \"design-system/themes/kawaii.yaml\"` w `layout.yaml` lub `layout.local.yaml`. Domyślny motyw się nie zmienia."
