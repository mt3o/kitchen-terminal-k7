date: "2026-09-23"
title: "Przepisy: nowe pole opisu"
items:
  - "Przy dodawaniu i edycji przepisu można teraz wpisać krótki opis (np. \"podwoić porcję, dobrze się mrozi\")."
  - "Opis pokazuje się na karcie przepisu, zaraz pod tytułem."
  - "Import z adresu URL wypełnia opis automatycznie, jeśli strona go podaje."
