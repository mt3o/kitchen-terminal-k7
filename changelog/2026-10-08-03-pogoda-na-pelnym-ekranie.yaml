date: "2026-10-08"
title: "Pogoda na pełnym ekranie"
items:
  - "Karta SYS.POGODA ma w nagłówku przycisk [ + ], jak kalendarz i przepisy. Dotknięcie otwiera pogodę na cały ekran, [ x ] w nagłówku ją zamyka."
  - "Na pełnym ekranie widać wszystkie dni prognozy, a obok obecnej pogody wykresy godzinowe temperatury i opadów — to samo, co pokazuje pokaz, gdy nikt nie dotyka ekranu. Jeśli coś się nie mieści, można to przewinąć palcem."
  - "Zwykła karta pogody na stronie GLOWNA ma tę samą wysokość co wcześniej: przycisk jest napisem w linii tytułu, a nie ramką, więc trzy dni prognozy dalej mieszczą się w karcie."
  - "Przycisk [ + ] karty w prawym górnym rogu strony nie zamyka już pełnego ekranu tym samym dotknięciem, które go otworzyło."
