date: "2026-10-08"
title: "Data pod zegarem mieści się w karcie na telefonie"
items:
  - "ZEGAR na telefonie: długi dzień tygodnia — „poniedziałek,” — wychodził poza prawą krawędź karty. Na telefonie data jest teraz o stopień mniejsza i mieści się w ramce, w dwóch liniach zamiast trzech."
  - "Na iPadzie zegar wygląda dokładnie tak jak wcześniej."
