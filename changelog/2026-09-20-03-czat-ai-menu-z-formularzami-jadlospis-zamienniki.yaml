date: "2026-09-20"
title: "Czat AI: MENU z formularzami, jadłospis, zamienniki i przeliczanie miar"
items:
  - "Przycisk MENU w nagłówku czatu (albo /menu) prowadzi przez polecenia w dwóch krokach. Krok 1: przyciski z nazwą i opisem, pogrupowane na GOTOWANIE, ROZMOWA i SYSTEM. Krok 2: co polecenie właściwie robi (i czego nie zrobi — np. nie nadpisze trwającego minutnika), a pod spodem podpisane pola do wypełnienia, każde z krótką podpowiedzią. Nie trzeba pamiętać składni ani szukać ukośnika na klawiaturze iPada."
  - "Pola podpowiadają gotowe wartości do kliknięcia: czasy minutnika, liczby porcji, listę modeli i składniki z ostatniego przepisu w rozmowie."
  - "Na dole kroku 2 widać dokładnie to polecenie, które zaraz zostanie uruchomione (np. /przelicz 2 szklanka mąki), a po uruchomieniu zostaje ono w oknie rozmowy — następnym razem można je po prostu wpisać."
  - "/plan układa jadłospis na wybraną liczbę dni na podstawie tego, co panel już wie: wydarzeń z kalendarza (w dni z wydarzeniami po 15:00 proponuje szybkie dania), prognozy pogody i przepisów z Twojej bazy. Dni spoza pobranego tygodnia są oznaczone jako \"brak danych z kalendarza\" zamiast udawać, że są wolne."
  - "/zamiennik masło — czym zastąpić składnik, z proporcjami i uwagą, jak zmieni się smak."
  - "/przelicz 2 szklanki mąki — odpowiada natychmiast, bez pytania AI, z tabeli miar kuchennych (szklanki, łyżki, łyżeczki, gramy, dekagramy); działa w obie strony, np. \"300 g mąki\" to około 2 szklanki. Podaje, jaką gęstość przyjął, więc wynik można podważyć. Gdy składnika nie ma w tabeli, pyta AI."
  - "/ponow zadaje ostatnie pytanie jeszcze raz — opcjonalnie od razu innym modelem (/ponow sonnet)."
