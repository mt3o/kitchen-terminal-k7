# Kitchen Terminal K7 — theme: "Kawaii"
#
# Cozy, friendly, cute: pastel rainbows, a round white cat with a unicorn
# horn (the caticorn), a chubby unicorn, a tabby asleep on a cloud. By day
# it is strawberry milk — pink-cream page, white notes, plum ink; after dark
# it is the same world at bedtime — plum sky, moon, stars — and at night the
# same again, dimmed, with the mascot asleep.
#
#   look                               slot
#   two illustrations + a pattern      ornament.pageBackground (a list per mode, hourly)
#   pastel rainbow ribbon round cards  ornament.cardFrame (nine-slice, 16px)
#   rainbow + heart under every title  ornament.rule
#   caticorn in the header             header.background, over a rainbow band
#   paw prints walking off each card   ornament.cardBackground, 7 % ink
#   rounded everything                 shape.borderRadiusPx 16
#   Nunito for reading, Baloo 2 titles typography
#
# The scenic backdrops (images/) are illustrations generated with Google
# Gemini for this theme and normalised as kawaii/CREDITS.md says. Everything
# in decor/ is vector art drawn by scripts/draw-kawaii-decor.mjs — edit the
# palette there and redraw, do not hand-edit the SVGs. Nothing is animated
# and nothing is blurred: the A8X rasterises each picture once.
#
# Palette ratios beside each role are on that mode's surface / surfaceRaised
# / surfaceSunken.

name: "Kawaii"
schemaVersion: 2

typography:
  # Nunito: rounded, friendly, all ten digits on one advance (the clock does
  # not shimmy), x-height 0.484 em against Source Code Pro's 0.486, so
  # DESIGN.md §4.2's distance table holds. Same files as punktomat's, shipped
  # again so neither theme reaches into the other's folder.
  fontFamily: "'Nunito', 'Nunito Sans', system-ui, -apple-system, sans-serif"
  baseSizePx: 20
  letterSpacingLabelsPx: 1
  scale:
    read:   { xs: 14, sm: 16, base: 20, lg: 24, xl: 32 }
    glance: { sm: 48, md: 72, lg: 112 }
  weights: { regular: 600, medium: 700, bold: 800 }
  monoFontFamily: "ui-monospace, 'SF Mono', Menlo, 'Courier New', monospace"
  fontFaces:
    - { family: "Nunito", weight: "400 900", src: "kawaii/fonts/nunito-latin.woff2",
        unicodeRange: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD" }
    - { family: "Nunito", weight: "400 900", src: "kawaii/fonts/nunito-latin-ext.woff2",
        unicodeRange: "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF" }
    - { family: "Baloo 2", weight: "400 800", src: "kawaii/fonts/baloo2-latin.woff2",
        unicodeRange: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD" }
    - { family: "Baloo 2", weight: "400 800", src: "kawaii/fonts/baloo2-latin-ext.woff2",
        unicodeRange: "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF" }
  # Card titles in Baloo 2, the bubbly one — titles only. Fredoka was the
  # first pick and was dropped: it has no ą ć ę ń ś ź ż. Sentence case
  # ("Log.wydarzenia"), tight leading so the card bodies keep their height.
  display:
    fontFamily: "'Baloo 2', 'Nunito', system-ui, -apple-system, sans-serif"
    sizePx: 24
    weight: 700
    case: lowercase
    letterSpacingPx: 0
    lineHeight: 1.0

colors:
  # --- surfaces: strawberry milk / bedtime plum ------------------------------
  background:     { light: "#fde4ef", dark: "#231a3a", night: "#120c1e" }
  backgroundDeep: { light: "#f8d3e6", dark: "#170f29", night: "#0a0612" }
  surface:        { light: "#fffafc", dark: "#2c2244", night: "#18122a" }
  surfaceRaised:  { light: "#ffffff", dark: "#372b52", night: "#1f1734" }
  surfaceSunken:  { light: "#fff0f6", dark: "#231a37", night: "#120d20" }

  # --- text -------------------------------------------------------------------
  textPrimary:  { light: "#4a2a52", dark: "#fbeefe", night: "#cbbbd8" }     # 11.66 / 13.22 / 10.04
  textMuted:    { light: "#7a4f80", dark: "#d6c3e4", night: "#a796b8" }     #  6.24 /  9.01 /  6.64
  textDisabled: { light: "#c9b3cc", dark: "#6d5d86", night: "#4a3f60" }

  # --- structure ----------------------------------------------------------------
  border:       { light: "#f3d9e8", dark: "#43365f", night: "#2a2140" }
  borderStrong: { light: "#b07aa8", dark: "#a58ec9", night: "#7d6c9b" }     # 3.28 / 5.15 / 3.88
  cardBorder:   { light: "#f0c6dd", dark: "#5a4580", night: "#3a2e55" }     # under the ribbon; shows only if the frame does not load

  # --- accent: raspberry by day, bubblegum after dark -----------------------------
  accent:   { light: "#c0367c", dark: "#ff9fd0", night: "#d47eaa" }         # 5.01 / 7.84 / 6.36
  accentFg: { light: "#ffffff", dark: "#2a0f22", night: "#120d20" }

  # --- status: mint, lemon, cherry -------------------------------------------------
  accentSecondary: { light: "#1d7558", dark: "#8ee6c3", night: "#6fbb9d" }
  signal:          { light: "#1d7558", dark: "#8ee6c3", night: "#6fbb9d" }  # 5.44 / 10.04 / 8.00
  warn:   { light: "#9a5800", dark: "#ffd37a", night: "#c9a764" }           # 5.39 / 10.46 / 7.93, ~70° off the accent
  danger: { light: "#c22f2f", dark: "#ff9a9a", night: "#d98282" }           # 5.43 /  7.29 / 6.44
  focus:  { light: "#8a4fd1", dark: "#cbb4ff", night: "#a48fd0" }           # lavender: 4.94 / 8.11 / 6.40

  # --- titles: lavender-violet ink ---------------------------------------------------
  display: { light: "#7a3d9e", dark: "#ffc6e8", night: "#cfa2c6" }          # 6.80 / 10.21 / 8.32

states:
  accentHover:  { light: "#a82c6b", dark: "#ffb6dc", night: "#de93ba" }
  accentActive: { light: "#8f245b", dark: "#f283bf", night: "#c06b97" }
  ghostHover:   { light: "#fde8f2", dark: "#3a2d57", night: "#221a38" }
  ghostActive:  { light: "#f8d6e7", dark: "#1f1733", night: "#0e0a18" }

shape:
  borderRadiusPx: 16      # = the frame's 32-unit corner drawn at half size
  borderWidthPx: 1
  borderWidthStrongPx: 2
  hudBrackets: false      # [ OK ] brackets are instrumentation; this is a sticker book

spacing:      { basePx: 4, gridGapPx: 12, cardPaddingPx: 16, cardMinHeightPx: 240 }  # 16 = the ribbon's drawn width
controls:     { heightPx: 56, heightSmallPx: 44, focusRingWidthPx: 3, focusRingOffsetPx: 2 }
layout:       { targetViewportPx: 1024, sidebarWidthPx: 260, breakpointTabletPx: 768, breakpointDesktopPx: 1024 }
motion:       { fastMs: 120, baseMs: 200, slowMs: 400, easing: "cubic-bezier(0.2, 0, 0, 1)", blinkPeriodMs: 1200 }
nightMode:    { enabled: true, trigger: sun, startTime: "22:00", endTime: "06:00" }
density:      { default: normal, largeScaleFactor: 1.2 }

# The header as a pastel rainbow band with the caticorn in the middle. By day
# the band is light and carries plum ink; after dark it is a deep rainbow with
# light ink. Every ink below is ≥4.5:1 on every stop of its band.
header:
  padding: "6px 16px"   # the band's height comes out of the deck; 6px ≈ the plain header
  background:
    light: 'asset("kawaii/decor/mascot.svg") center center / 44px 44px no-repeat, linear-gradient(90deg, #ffd3e7 0%, #ffe2c6 22%, #fff1bd 42%, #d3f3e2 62%, #cde6ff 80%, #e6d6ff 100%)'
    dark:  'asset("kawaii/decor/mascot-dark.svg") center center / 44px 44px no-repeat, linear-gradient(90deg, #55305f 0%, #43346b 50%, #2f3b6b 100%)'
    night: 'asset("kawaii/decor/mascot-night.svg") center center / 44px 44px no-repeat, linear-gradient(90deg, #2a1a33 0%, #221c3b 50%, #1a2140 100%)'
  colors:
    textPrimary:   { light: "#4a2a52", dark: "#fff4fb", night: "#d5c6e2" }   # 8.84 / 9.92 / 9.74 on the worst stop
    textMuted:     { light: "#6b4272", dark: "#ead8f2", night: "#b9a8c9" }   # 5.83 / 7.90 / 7.12
    display:       { light: "#4a2a52", dark: "#fff4fb", night: "#d5c6e2" }
    border:        { light: "#4a2a5226", dark: "#ffffff40", night: "#ffffff26" }
    borderStrong:  { light: "#00000000", dark: "#00000000", night: "#00000000" }  # the rainbow rule is the edge
    signal:        { light: "#17654b", dark: "#a8f0d2", night: "#86c9ad" }   # 5.14 / 8.13 / 8.22
    danger:        { light: "#a82727", dark: "#ffc4c4", night: "#e2a3a3" }   # 5.17 / 7.06 / 7.49
    accent:        { light: "#a82c6b", dark: "#ff9fd0", night: "#d47eaa" }   # the cursor, a pink heartbeat: 4.77 on the band's palest stop
    focus:         { light: "#8a4fd1", dark: "#cbb4ff", night: "#a48fd0" }
    surfaceRaised: { light: "#fff4fa", dark: "#4a3070", night: "#251c3d" }   # the pull-to-refresh tab
    ghostHover:    { light: "#4a2a5214", dark: "#ffffff1f", night: "#ffffff14" }
    ghostActive:   { light: "#4a2a5224", dark: "#ffffff33", night: "#ffffff24" }

ornament:
  backdropEveryMinutes: 60
  # A footer band so the footer text never sits on a rainbow; night dims the
  # whole picture as well — a bedtime sky that does not glow at 03:00.
  pageOverlay:
    light: "linear-gradient(to top, rgba(255, 245, 250, 0.95) 0, rgba(255, 245, 250, 0.85) 56px, rgba(255, 245, 250, 0) 112px)"
    dark:  "linear-gradient(to top, rgba(23, 15, 41, 0.92) 0, rgba(23, 15, 41, 0.78) 56px, rgba(23, 15, 41, 0) 116px)"
    night: >-
      linear-gradient(to top, rgba(10, 6, 18, 0.95) 0, rgba(10, 6, 18, 0.85) 56px, rgba(10, 6, 18, 0.6) 116px),
      linear-gradient(rgba(10, 6, 18, 0.55), rgba(10, 6, 18, 0.55))
  pageBackground:
    light:
      - 'asset("kawaii/images/meadow-light.jpg") center / cover no-repeat'
      - 'asset("kawaii/images/catnap-light.jpg") center / cover no-repeat'
      - 'asset("kawaii/decor/backdrop-sweets-light.svg") center / cover no-repeat'
    dark:     # night has no list of its own and rotates through these, damped by its overlay
      - 'asset("kawaii/images/moon-dark.jpg") center / cover no-repeat'
      - 'asset("kawaii/images/hill-dark.jpg") center / cover no-repeat'
      - 'asset("kawaii/decor/backdrop-sweets-dark.svg") center / cover no-repeat'

  # Paws walking off the bottom-left of every card; the status badge lives
  # bottom-right, so they stay out of its way. 7 % ink. None at night.
  cardBackground:
    light: 'asset("kawaii/decor/paws-light.svg") left -8px bottom -10px / 176px 128px no-repeat'
    dark:  'asset("kawaii/decor/paws-dark.svg") left -8px bottom -10px / 176px 128px no-repeat'
    night: "linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0))"   # an explicit nothing, or night inherits dark's paws

  cardFrame:
    light: 'asset("kawaii/decor/frame-light.svg") 32 / 16px / 0 stretch'
    dark:  'asset("kawaii/decor/frame-dark.svg") 32 / 16px / 0 stretch'
    night: 'asset("kawaii/decor/frame-night.svg") 32 / 16px / 0 stretch'

  rule:
    light: 'asset("kawaii/decor/rule-light.svg") 0 0 30 0 / 0 0 20px 0 / 0 0 16px 0 round'
    dark:  'asset("kawaii/decor/rule-dark.svg") 0 0 30 0 / 0 0 20px 0 / 0 0 16px 0 round'
    night: 'asset("kawaii/decor/rule-night.svg") 0 0 30 0 / 0 0 20px 0 / 0 0 16px 0 round'

transparency: { surfaceOpacity: 1, backdropBlurPx: 4 }
boxShadow: []     # DESIGN.md §5: depth comes from the ribbon, not a shadow
effects:
  blinkingCursor: true
  scanlines: false
