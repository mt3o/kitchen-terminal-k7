# Kitchen Terminal K7 — user-facing changelog.
#
# CLAUDE.md's standing constraints require every user-facing change to add an
# entry here, with a date, in the same change that makes it — the changelog
# card in the dashboard header reads this file (served via GET /api/changelog),
# so an entry that lands later than the change it describes is one the
# household never actually saw associated with what changed.
#
# Newest entry first.
entries:
  - date: "2026-09-10"
    title: "Audiometr: procent względny, surowy odczyt dB"
    items:
      - "Procent głośności jest teraz względny do ostatnich 30 sekund, z łagodnym opadaniem szczytu zamiast sztywnej skali."
      - "Karta pokazuje teraz też surowy (niewygładzony) odczyt w dB obok głównego wskaźnika."
  - date: "2026-09-10"
    title: "Nowa karta: obraz statyczny; niższa stopka"
    items:
      - "Nowy typ karty `image` — pojedynczy obraz spod URL, bez rotacji."
      - "Karuzela zdjęć to zwykła karuzela ze slajdami typu image."
      - "Pasek stopki nieco niższy."
  - date: "2026-09-10"
    title: "Odświeżanie przeciągnięciem, dziennik zmian"
    items:
      - "Przeciągnięcie w dół od góry ekranu (nagłówek) odświeża dashboard."
      - "Nowy przycisk w nagłówku pokazuje ten dziennik zmian."
