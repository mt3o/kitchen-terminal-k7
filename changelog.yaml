# Kitchen Terminal K7 — user-facing changelog.
#
# CLAUDE.md's standing constraints require every user-facing change to add an
# entry here, with a date, in the same change that makes it — the changelog
# card in the dashboard header reads this file (served via GET /api/changelog),
# so an entry that lands later than the change it describes is one the
# household never actually saw associated with what changed.
#
# Newest entry first.
entries:
  - date: "2026-09-21"
    title: "Nowy motyw: Punktomat"
    items:
      - "Czwarty motyw do wyboru wygląda jak Punktomat: białe karteczki przypięte do korkowej tablicy, fioletowy pasek nagłówka z gradientem, zaokrąglone rogi i krój Nunito. Z Punktomatu przyszła też faktura korka, pajęczyna w rogu i plama po kawie."
      - "Punktomat ma tylko tryb jasny, więc tryby ciemny i nocny są nowe: ta sama tablica po zmroku — ciemny korek, grafitowe karteczki, lawendowy fiolet — a nocą jeszcze ciemniej."
      - "Zielony, pomarańczowy i czerwony z Punktomatu są przyciemnione tak, żeby napisy w tych kolorach dało się przeczytać z metra; każdy napis ma kontrast co najmniej 4,5:1 we wszystkich trybach."
      - "Włącza się go tak samo jak inne motywy: `theme: \"design-system/themes/punktomat.yaml\"` w `layout.yaml` albo w `layout.local.yaml`. Domyślny motyw się nie zmienia."
  - date: "2026-09-21"
    title: "Kalendarze: jedna lista w layout.yaml, layout.local.yaml z tymi samymi kluczami"
    items:
      - "Kalendarze są teraz zdefiniowane raz, na górze `layout.yaml`, w sekcji `calendars` — obie karty kalendarza (GŁÓWNA i KALENDARZ) pokazują te same kalendarze, bez powtarzania listy w każdej karcie."
      - "Zamiast `showInMain: true` przy każdym kalendarzu jest jedna lista `mainCalendars` z id kalendarzy, które łączy zakładka GŁÓWNY."
      - "`layout.local.yaml` używa teraz tych samych kluczy co `layout.yaml` (`calendars`, `mainCalendars`) zamiast osobnego `calendarAdditions`. Stary plik trzeba przepisać według `layout.local.yaml.example` — klucz `calendarAdditions` nie jest już czytany."
      - "Literówka w `mainCalendars` (id, którego nie ma w `calendars`) daje czytelny błąd layoutu zamiast po cichu pustej pozycji w GŁÓWNY."
  - date: "2026-09-21"
    title: "Nowy motyw: Steampunk Brass"
    items:
      - "Do wyboru jest trzeci motyw, w stylu steampunk: mosiężne ramki z nitami wokół kart, mosiężne listwy pod nagłówkami, tytuły kart pisane kaligraficzną kursywą, tekst w wiktoriańskim kroju szeryfowym, a sztuka ASCII w kroju maszyny do pisania."
      - "W tle zdjęcia, które zmieniają się co godzinę: w trybie ciemnym i nocnym sześć ujęć mosiężnej maszynerii (mechanizmy zegarów, ściana manometrów, koła parowozu), w trybie jasnym sześć starych papierów i rycin (pergamin, dawne mapy świata, mapa gór). Kolejne zdjęcie wczytuje się, zanim się pojawi, więc zmiana nie miga — a gdy serwer nie odpowiada, zostaje obecne. Karty mają w rogu delikatnie wygrawerowane koło zębate, a w trybie jasnym — fakturę starego papieru."
      - "Czytelność sprawdzona na prawdziwym obrazie tła, a nie tylko na kolorze: każdy napis w nagłówku, stopce i na kartach ma kontrast co najmniej 4,5:1 we wszystkich trzech trybach i na każdym z teł."
      - "Włącza się go jedną linią w `layout.yaml`: `theme: \"design-system/themes/steampunk-brass.yaml\"`. Żeby wypróbować go tylko na jednym komputerze, tę samą linię można wpisać do `layout.local.yaml` — zmiana działa po odświeżeniu strony. Obecny motyw zostaje domyślny i wygląda dokładnie tak jak dotąd."
  - date: "2026-09-21"
    title: "Karty nie są już ucięte u dołu"
    items:
      - "Każda karta na każdej stronie była o kilkadziesiąt pikseli wyższa niż jej miejsce na ekranie, więc jej dolna krawędź była ucinana. Teraz karta mieści się dokładnie: widać dolną ramkę i znacznik stanu w prawym dolnym rogu ([OK], [!], [X], [--]), który wcześniej był zawsze ukryty."
      - "LOG.WYDARZENIA: lista dni kończy się teraz nad znacznikiem stanu, zamiast na niego nachodzić, a ostatnie wydarzenia tygodnia da się przewinąć do końca — wcześniej ich dolna część była ucięta nawet po przewinięciu."
  - date: "2026-09-21"
    title: "Nowy przycisk DZIENNIK BŁĘDÓW: panel pamięta, co poszło nie tak"
    items:
      - "Przycisk [ ! ] DZIENNIK BŁĘDÓW w nagłówku pokazuje listę zdarzeń: np. \"komiks dnia wrócił do wersji sprzed godziny, bo źródło nie odpowiedziało\", \"kalendarz nie mógł się załadować\" albo błąd, który wystąpił w przeglądarce na iPadzie."
      - "Każdy wpis ma znacznik [!] (zdarzenie obsłużone, np. użyto starszych danych z pamięci) albo [X] (błąd), źródło i czas."
      - "Działa niezależnie od tego, czy skonfigurowano zewnętrzne raportowanie błędów (GlitchTip) — dziennik jest zawsze włączony i czytany bezpośrednio z panelu."
  - date: "2026-09-20"
    title: "Kalendarz Google: podłączenie konta z przeglądarki"
    items:
      - "Nowy panel pod adresem `/admin` pozwala podłączyć konto Google przez okno zgody Google, zamiast wklejania tokenu do pliku `.env.local` na serwerze."
      - "Panel jest chroniony tokenem administratora (`K7_ADMIN_TOKEN`) — bez niego adresy panelu w ogóle nie istnieją. Token wkleja się raz, w przeglądarce laptopa; na iPadzie w kuchni nic się nie zmienia."
      - "Token odświeżania zapisywany jest w bazie, zaszyfrowany kluczem `K7_SECRET_KEY`, i ma pierwszeństwo przed zmienną środowiskową."
      - "Panel pokazuje, które konto jest podłączone i pozwala je rozłączyć (z cofnięciem dostępu po stronie Google)."
  - date: "2026-09-20"
    title: "Czat AI: MENU z formularzami, jadłospis, zamienniki i przeliczanie miar"
    items:
      - "Przycisk MENU w nagłówku czatu (albo /menu) prowadzi przez polecenia w dwóch krokach. Krok 1: przyciski z nazwą i opisem, pogrupowane na GOTOWANIE, ROZMOWA i SYSTEM. Krok 2: co polecenie właściwie robi (i czego nie zrobi — np. nie nadpisze trwającego minutnika), a pod spodem podpisane pola do wypełnienia, każde z krótką podpowiedzią. Nie trzeba pamiętać składni ani szukać ukośnika na klawiaturze iPada."
      - "Pola podpowiadają gotowe wartości do kliknięcia: czasy minutnika, liczby porcji, listę modeli i składniki z ostatniego przepisu w rozmowie."
      - "Na dole kroku 2 widać dokładnie to polecenie, które zaraz zostanie uruchomione (np. /przelicz 2 szklanka mąki), a po uruchomieniu zostaje ono w oknie rozmowy — następnym razem można je po prostu wpisać."
      - "/plan układa jadłospis na wybraną liczbę dni na podstawie tego, co panel już wie: wydarzeń z kalendarza (w dni z wydarzeniami po 15:00 proponuje szybkie dania), prognozy pogody i przepisów z Twojej bazy. Dni spoza pobranego tygodnia są oznaczone jako \"brak danych z kalendarza\" zamiast udawać, że są wolne."
      - "/zamiennik masło — czym zastąpić składnik, z proporcjami i uwagą, jak zmieni się smak."
      - "/przelicz 2 szklanki mąki — odpowiada natychmiast, bez pytania AI, z tabeli miar kuchennych (szklanki, łyżki, łyżeczki, gramy, dekagramy); działa w obie strony, np. \"300 g mąki\" to około 2 szklanki. Podaje, jaką gęstość przyjął, więc wynik można podważyć. Gdy składnika nie ma w tabeli, pyta AI."
      - "/ponow zadaje ostatnie pytanie jeszcze raz — opcjonalnie od razu innym modelem (/ponow sonnet)."
  - date: "2026-09-20"
    title: "Minutnik i audiometr przeniesione na PRZEPISY"
    items:
      - "Strona NARZĘDZIA zniknęła — minutnik i audiometr są teraz kolejnymi zakładkami w MENU na stronie PRZEPISY, obok PRZEPISY i CZAT."
      - "Obie karty mają teraz też przycisk pełnego ekranu w nagłówku."
  - date: "2026-09-20"
    title: "PRZEPISY: szersza kolumna treści, pionowe zakładki, pełny ekran"
    items:
      - "Strona PRZEPISY: kolumna z przepisami/czatem jest teraz dwa razy szersza niż kolumna z zakładkami MENU, zamiast równego podziału na pół."
      - "Zakładki PRZEPISY/CZAT w MENU ułożone są teraz pionowo, jedna pod drugą."
      - "BAZA.PRZEPISY i CZAT.AI mają teraz przycisk pełnego ekranu w nagłówku karty, tak jak kalendarz i zdjęcia."
  - date: "2026-09-19"
    title: "Czat AI: archiwum rozmów, polecenia i zapisywanie przepisów"
    items:
      - "Przycisk ARCHIWUM w nagłówku czatu pokazuje poprzednie rozmowy — można do nich wrócić, zmienić im nazwę (/tytul) albo je usunąć (× i potwierdzenie USUN?). Po przeładowaniu strony czat wraca do rozmowy, która była otwarta na tym urządzeniu."
      - "Przycisk NOWA (albo polecenie /clear) zaczyna rozmowę od zera — poprzednia zostaje w archiwum."
      - "/przepis zamienia ostatnią odpowiedź AI w przepis i otwiera go do sprawdzenia w BAZA.PRZEPISY. Nic nie zapisuje się samo — dopiero ZAPISZ w karcie przepisów."
      - "/zakupy wyciąga składniki z ostatniego przepisu i pokazuje je z polami do odznaczenia; to, co już jest na liście, jest od razu odznaczone. DODAJ wpisuje resztę na LISTA.ZAKUPY."
      - "Czasy w odpowiedziach AI i w krokach przepisu („gotuj 12 minut”) można stuknąć, żeby uruchomić minutnik. To samo robi /minutnik 10 (albo 7:30, 90s, 1h 15min). Minutnik, który już odlicza, nie zostanie nadpisany."
      - "Nowe polecenia: /porcje 4 (przelicz przepis), /lodowka jajka, szpinak (co z tego ugotować), /pogoda (wskazówki na dziś z prognozy), /context (ile okna kontekstu jest zajęte i ile zostaje na odpowiedź), /model (zmiana modelu w trakcie rozmowy), /koszt (wydatki dziś i z 30 dni), /pomoc. Nad polem wiadomości jest rząd przycisków z poleceniami — nie trzeba szukać ukośnika na klawiaturze."
      - "BAZA.PRZEPISY: stuknięcie tytułu otwiera przepis — składniki, kroki i przycisk EDYTUJ."
      - "Przepisy są teraz zwykłymi plikami Markdown w osobnym katalogu na serwerze, poza instalacją aplikacji — aktualizacja panelu ich nie rusza, a można je edytować i kopiować ręcznie. Dotychczasowe przepisy zostały przeniesione automatycznie."
  - date: "2026-09-19"
    title: "Nowe kalendarze: święta, wschód słońca, prywatny kalendarz"
    items:
      - "Karta KALENDARZ (na GŁÓWNEJ i na pełnoekranowej stronie KALENDARZ) pokazuje teraz dodatkowe zakładki: Święta (polskie święta i dni wolne) oraz — jeśli skonfigurowane lokalnie — inne prywatne kalendarze domownika."
      - "Prywatne kalendarze (np. osobisty adres kalendarza) konfiguruje się teraz w osobnym, niewysyłanym do repozytorium pliku (\"layout.local.yaml\"), żeby nie trafiały do publicznego repo GitHub."
  - date: "2026-09-17"
    title: "Nowy układ stron — pogrupowane wg sposobu użycia"
    items:
      - "GŁÓWNA: zegar, pogoda, kalendarz i ascii-art dnia — jedna strona z tym, co widać od progu."
      - "Nowa strona KALENDARZ: ten sam tydzień co na GŁÓWNEJ, ale na całą szerokość strony — łatwiej przeczytać tytuły wydarzeń niż w połówce siatki 2x2."
      - "Nowa strona NARZĘDZIA: minutnik i audiometr razem — do użycia przy gotowaniu, nie od progu."
      - "Nowa strona PRZEPISY: baza przepisów, a obok w zakładce (przycisk MENU) czat AI — pytanie \"co ugotować z tego, co mam\" jest jedno kliknięcie dalej."
      - "Nowa strona ZAKUPY: lista zakupów sama na całej stronie, zamiast dzielić kolumnę z inną kartą."
      - "Nowa strona PUNKTOMAT: kod QR do logowania razem z karuzelą zdjęć kotów — strona \"tak dla zabawy\"."
      - "Nowa strona KOMIKS: codzienny komiks sam na stronie."
      - "Usunięto duplikaty (dwa zegary, dwa pogody, dwa minutniki) oraz karty, które tylko zajmowały miejsce bez realnej treści (zagnieżdżona siatka z jednym zegarem, karuzela zegar+pogoda)."
  - date: "2026-09-16"
    title: "Pogoda z rysunkiem; kod QR i zdjęcia na pełny ekran"
    items:
      - "Karta SYS.POGODA pokazuje obok temperatury rysunek ASCII aktualnej pogody — słońce, chmury, deszcz, śnieg, mgłę albo burzę."
      - "Karty z kodem QR i ze zdjęciami z Unsplash mają teraz w nagłówku przycisk [ + ], który powiększa je na cały ekran — tak samo jak kalendarz. [ x ] zamyka."
  - date: "2026-09-15"
    title: "Panel działa poprawnie na ekranie telefonu"
    items:
      - "Wcześniej na wąskim ekranie (telefon) nagłówek się zawijał i zasłaniał przyciski, a treść kart (minutnik, ascii dnia, pogoda, zegar) była ucinana na dole ekranu. Teraz każda karta mieści się w całości, bez przewijania strony."
      - "Strony z większą liczbą kart (np. SYSTEM) zachowują dwie kolumny również na telefonie — jedna kolumna dawała zbyt mało miejsca na czytelną treść."
      - "Karty z własnym formularzem (lista zakupów, minutnik z własnym czasem, import przepisów) przewijają się w całości, gdy nie mieszczą się na raz — przycisk dodawania/startu już nie znika za krawędzią karty."
      - "Zbyt długie etykiety i opisy w nagłówku karty są teraz skracane wielokropkiem zamiast być po prostu ucinane bez śladu."
  - date: "2026-09-15"
    title: "Poprawka: daty w kalendarzu mogły nie odświeżać się po zmianie tygodnia"
    items:
      - "Nagłówki dni w karcie kalendarza były ustawiane tylko raz przy starcie karty; na urządzeniu działającym bez przeładowania przez dłuższy czas mogły przestać zgadzać się z faktyczną datą po zmianie tygodnia. Teraz aktualizują się razem z resztą karty."
      - "Wzmocniono też zabezpieczenia zapytań do zewnętrznych adresów kalendarza i komiksu dnia po stronie serwera."
  - date: "2026-09-15"
    title: "Kalendarz: wiele kalendarzy z zakładkami"
    items:
      - "Karta kalendarza obsługuje teraz kilka kalendarzy naraz — Google oraz dowolną liczbę zewnętrznych kalendarzy .ics (np. plan lekcji dziecka). Każdy dostaje własną zakładkę; zakładka GŁÓWNY łączy tylko te kalendarze, które mają włączoną opcję \"pokazuj na głównym widoku\"."
      - "Kalendarz z problemem (nieaktualne dane lub brak połączenia) dostaje odpowiedni znacznik na swojej zakładce zamiast pustej karty."
      - "Przy jednym skonfigurowanym kalendarzu karta wygląda dokładnie tak jak wcześniej — pasek zakładek pojawia się dopiero od dwóch kalendarzy."
  - date: "2026-09-15"
    title: "Nowa karta: zdjęcia z Unsplash"
    items:
      - "Karuzela zdjęć na stronie SYSTEM pobiera teraz zdjęcia kotów prosto z Unsplash i co kilka godzin losuje nowy zestaw, zamiast pokazywać w kółko te same pięć."
      - "Pod każdym zdjęciem jest jego autor i link do Unsplash."
  - date: "2026-09-15"
    title: "Karuzela zdjęć: więcej zdjęć kotów"
    items:
      - "Karuzela zdjęć na stronie SYSTEM ma teraz pięć zdjęć zamiast dwóch."
  - date: "2026-09-15"
    title: "Kalendarz: przycisk pełnego ekranu"
    items:
      - "Karta kalendarza ma teraz przycisk [ + ] w nagłówku, który powiększa ją na cały ekran; [ x ] zamyka. Jeśli w tym momencie leci pokaz slajdów, zatrzymuje się na czas przeglądania kalendarza i wraca tam, gdzie był, po zamknięciu."
  - date: "2026-09-10"
    title: "Panel dostępny pod adresem bez numeru portu"
    items:
      - "Terminal K7 odpowiada teraz pod https://k7.revert-h0m3.co.pl/ bez podawania numeru portu — serwer nginx na tej samej maszynie przyjmuje ruch na standardowych portach 80 i 443 i kieruje go dalej do K7; port 80 przekierowuje na https."
  - date: "2026-09-10"
    title: "Poprawka: generowanie ASCII-artu mogło wisieć bez końca"
    items:
      - "Zapytanie do bramki AI (kilo-auto/free) mogło nigdy nie dostać odpowiedzi ani błędu, blokując kartę ASCII.DNIA (i podsumowania w czacie) w nieskończoność. Teraz ma limit czasu 45s, po którym karta pokazuje ostatni dobry wynik albo rezerwowy ascii-art zamiast wisieć."
  - date: "2026-09-10"
    title: "Kalendarz: data i numer dnia znów na jednej linii"
    items:
      - "Skrót dnia tygodnia i numer daty są teraz obok siebie zamiast jeden pod drugim — pierwsza linia wydarzeń wyrównuje się do numeru dnia, a nie do małej szarej etykiety nad nim."
  - date: "2026-09-10"
    title: "Poprawka: krzywe wyrównanie w kalendarzu"
    items:
      - "Kolumna z datą ma teraz stałą szerokość, więc wydarzenia we wszystkich dniach zaczynają się w tym samym miejscu zamiast \"skakać\" w zależności od szerokości etykiety dnia."
      - "Znak \"—\" przy pustym dniu jest teraz przy dacie, a nie oderwany na środku wiersza."
  - date: "2026-09-10"
    title: "Jasny motyw z paska stopki; węższy pasek górny"
    items:
      - "Nowy przycisk w stopce przełącza między jasnym a ciemnym motywem; wybór jest zapamiętywany."
      - "Pasek górny (nagłówek) niższy — mniej miejsca zajmowanego kosztem karty."
  - date: "2026-09-10"
    title: "Kalendarz: dni jeden pod drugim zamiast siedmiu wąskich kolumn"
    items:
      - "Tydzień w karcie LOG.WYDARZENIA pokazuje teraz dni jako pełnej szerokości wiersze, przewijane pionowo — poprzednio siedem kolumn ściskało tytuły wydarzeń do jednej litery na wiersz."
  - date: "2026-09-10"
    title: "Siatka (SIATKA): mniejszy odstęp i czcionka dla zagnieżdżonych kart"
    items:
      - "Karty zagnieżdżone w karcie typu siatka dostają teraz mniejszy margines wewnętrzny i mniejszą czcionkę, w tym mniejsze cyfry zegara — wcześniej zegar mógł nie mieścić się w swojej komórce."
  - date: "2026-09-10"
    title: "Karuzela zdjęć: koty z Unsplash zamiast placeholderów; QR logowania"
    items:
      - "Karuzela zdjęć na stronie SYSTEM pokazuje teraz zdjęcia kotów zamiast szarych placeholderów."
      - "Statyczny obraz na stronie SYSTEM to teraz kod QR logowania do Punktomatu, z własną etykietą karty."
      - "ASCII.DNIA pokazuje teraz statyczny rezerwowy ascii-art kota, gdy generowanie się nie powiedzie (np. brak klucza do bramki AI), zamiast pustej karty."
  - date: "2026-09-10"
    title: "Poprawka: przyciski minutnika obcinane na dole karty"
    items:
      - "Gdy karta MINUTNIK dostawała mniej miejsca niż potrzebowały wszystkie presety czasu, ostatni rząd przycisków był ucinany w połowie zamiast być dostępny przez przewijanie."
  - date: "2026-09-10"
    title: "Poprawka: obraz komiksu/zdjęcia rozlewał się poza kartę na iPadzie"
    items:
      - "Na Safari (iPad) obrazek w karcie \"komiks dnia\" oraz w karcie \"obraz\" mógł wyrenderować się w naturalnym rozmiarze, nachodząc na nagłówek karty i wiersz pod spodem, zamiast zmieścić się w karcie."
  - date: "2026-09-10"
    title: "Audiometr: procent względny, surowy odczyt dB"
    items:
      - "Procent głośności jest teraz względny do ostatnich 30 sekund, z łagodnym opadaniem szczytu zamiast sztywnej skali."
      - "Karta pokazuje teraz też surowy (niewygładzony) odczyt w dB obok głównego wskaźnika."
  - date: "2026-09-10"
    title: "Nowa karta: obraz statyczny; niższa stopka"
    items:
      - "Nowy typ karty `image` — pojedynczy obraz spod URL, bez rotacji."
      - "Karuzela zdjęć to zwykła karuzela ze slajdami typu image."
      - "Pasek stopki nieco niższy."
  - date: "2026-09-10"
