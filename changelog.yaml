# Kitchen Terminal K7 — user-facing changelog.
#
# CLAUDE.md's standing constraints require every user-facing change to add an
# entry here, with a date, in the same change that makes it — the changelog
# card in the dashboard header reads this file (served via GET /api/changelog),
# so an entry that lands later than the change it describes is one the
# household never actually saw associated with what changed.
#
# Newest entry first.
entries:
  - date: "2026-09-10"
    title: "Poprawka: generowanie ASCII-artu mogło wisieć bez końca"
    items:
      - "Zapytanie do bramki AI (kilo-auto/free) mogło nigdy nie dostać odpowiedzi ani błędu, blokując kartę ASCII.DNIA (i podsumowania w czacie) w nieskończoność. Teraz ma limit czasu 45s, po którym karta pokazuje ostatni dobry wynik albo rezerwowy ascii-art zamiast wisieć."
  - date: "2026-09-10"
    title: "Kalendarz: data i numer dnia znów na jednej linii"
    items:
      - "Skrót dnia tygodnia i numer daty są teraz obok siebie zamiast jeden pod drugim — pierwsza linia wydarzeń wyrównuje się do numeru dnia, a nie do małej szarej etykiety nad nim."
  - date: "2026-09-10"
    title: "Poprawka: krzywe wyrównanie w kalendarzu"
    items:
      - "Kolumna z datą ma teraz stałą szerokość, więc wydarzenia we wszystkich dniach zaczynają się w tym samym miejscu zamiast \"skakać\" w zależności od szerokości etykiety dnia."
      - "Znak \"—\" przy pustym dniu jest teraz przy dacie, a nie oderwany na środku wiersza."
  - date: "2026-09-10"
    title: "Jasny motyw z paska stopki; węższy pasek górny"
    items:
      - "Nowy przycisk w stopce przełącza między jasnym a ciemnym motywem; wybór jest zapamiętywany."
      - "Pasek górny (nagłówek) niższy — mniej miejsca zajmowanego kosztem karty."
  - date: "2026-09-10"
    title: "Kalendarz: dni jeden pod drugim zamiast siedmiu wąskich kolumn"
    items:
      - "Tydzień w karcie LOG.WYDARZENIA pokazuje teraz dni jako pełnej szerokości wiersze, przewijane pionowo — poprzednio siedem kolumn ściskało tytuły wydarzeń do jednej litery na wiersz."
  - date: "2026-09-10"
    title: "Siatka (SIATKA): mniejszy odstęp i czcionka dla zagnieżdżonych kart"
    items:
      - "Karty zagnieżdżone w karcie typu siatka dostają teraz mniejszy margines wewnętrzny i mniejszą czcionkę, w tym mniejsze cyfry zegara — wcześniej zegar mógł nie mieścić się w swojej komórce."
  - date: "2026-09-10"
    title: "Karuzela zdjęć: koty z Unsplash zamiast placeholderów; QR logowania"
    items:
      - "Karuzela zdjęć na stronie SYSTEM pokazuje teraz zdjęcia kotów zamiast szarych placeholderów."
      - "Statyczny obraz na stronie SYSTEM to teraz kod QR logowania do Punktomatu, z własną etykietą karty."
      - "ASCII.DNIA pokazuje teraz statyczny rezerwowy ascii-art kota, gdy generowanie się nie powiedzie (np. brak klucza do bramki AI), zamiast pustej karty."
  - date: "2026-09-10"
    title: "Poprawka: przyciski minutnika obcinane na dole karty"
    items:
      - "Gdy karta MINUTNIK dostawała mniej miejsca niż potrzebowały wszystkie presety czasu, ostatni rząd przycisków był ucinany w połowie zamiast być dostępny przez przewijanie."
  - date: "2026-09-10"
    title: "Poprawka: obraz komiksu/zdjęcia rozlewał się poza kartę na iPadzie"
    items:
      - "Na Safari (iPad) obrazek w karcie \"komiks dnia\" oraz w karcie \"obraz\" mógł wyrenderować się w naturalnym rozmiarze, nachodząc na nagłówek karty i wiersz pod spodem, zamiast zmieścić się w karcie."
  - date: "2026-09-10"
    title: "Audiometr: procent względny, surowy odczyt dB"
    items:
      - "Procent głośności jest teraz względny do ostatnich 30 sekund, z łagodnym opadaniem szczytu zamiast sztywnej skali."
      - "Karta pokazuje teraz też surowy (niewygładzony) odczyt w dB obok głównego wskaźnika."
  - date: "2026-09-10"
    title: "Nowa karta: obraz statyczny; niższa stopka"
    items:
      - "Nowy typ karty `image` — pojedynczy obraz spod URL, bez rotacji."
      - "Karuzela zdjęć to zwykła karuzela ze slajdami typu image."
      - "Pasek stopki nieco niższy."
  - date: "2026-09-10"
    title: "Odświeżanie przeciągnięciem, dziennik zmian"
    items:
      - "Przeciągnięcie w dół od góry ekranu (nagłówek) odświeża dashboard."
      - "Nowy przycisk w nagłówku pokazuje ten dziennik zmian."
