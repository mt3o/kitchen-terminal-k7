<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wireframe — kalendarz tygodnia (retro terminal)</title>
<style>
  :root {
    --bg: #f4f2ec; --surface: #ffffff; --border: #b4b2a9; --border-strong: #5f5e5a;
    --text: #2c2c2a; --text-muted: #888780; --amber-bg: #faeeda; --amber-text: #633806; --amber-border: #ba7517;
    --teal-bg: #e1f5ee; --teal-text: #085041; --teal-border: #1d9e75;
  }
  body { background: var(--bg); font-family: 'Courier New', monospace; padding: 24px; }
  .card { max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 16px; }
  .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border-strong); font-size:13px; letter-spacing:1px; color: var(--text-muted); }
  .head .accent { color: var(--amber-text); }
  .grid { display:grid; grid-template-columns: 40px 1fr; gap:6px; }
  .day { font-size:12px; color: var(--text-muted); padding:6px 0; }
  .day.today { color: var(--amber-text); font-weight:bold; }
  .events { display:flex; flex-direction:column; gap:4px; }
  .event { padding:4px 8px; border-left:3px solid var(--amber-border); background: var(--amber-bg); color: var(--amber-text); font-size:13px; display:flex; justify-content:space-between; }
  .event.teal { border-color: var(--teal-border); background: var(--teal-bg); color: var(--teal-text); }
  .empty { font-size:13px; color: var(--text-muted); padding:4px 8px; }
  .today-box { border: 1px dashed var(--border-strong); padding:4px; }
  button { width:100%; margin-top:12px; font-family: inherit; font-size:13px; padding:8px; border:1px solid var(--border-strong); background:transparent; border-radius:6px; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><span>KUCHNIA // TYDZIEN 37</span><span class="accent">2026</span></div>
  <div class="grid">
    <div class="day">PON</div>
    <div class="events"><div class="event"><span>09:00 — dentysta</span><span>✎ 🗑</span></div></div>

    <div class="day">WT</div>
    <div class="events"><div class="empty">— brak wydarzen —</div></div>

    <div class="day">SR</div>
    <div class="events"><div class="event teal"><span>18:30 — trening</span><span>✎ 🗑</span></div></div>

    <div class="day today">CZW</div>
    <div class="events today-box">
      <div class="event" style="border:none; background:none; padding:4px 8px;"><span>12:00 — obiad rodzinny</span><span>✎ 🗑</span></div>
      <div class="empty">DZIS</div>
    </div>

    <div class="day">PT</div>
    <div class="events"><div class="empty">— brak wydarzen —</div></div>

    <div class="day">SOB</div>
    <div class="events"><div class="event"><span>10:00 — zakupy</span></div></div>

    <div class="day">NDZ</div>
    <div class="events"><div class="empty">— brak wydarzen —</div></div>
  </div>
  <button>+ dodaj wydarzenie</button>
</div>
</body>
</html>
