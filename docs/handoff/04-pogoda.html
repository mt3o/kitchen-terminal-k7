<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wireframe — prognoza pogody (HUD retro sci-fi)</title>
<style>
  :root {
    --bg: #1a1712; --surface: #211d16; --amber: #faab2f; --amber-dim: #ba7517;
    --teal: #5dcaa5; --text-muted: #888780;
  }
  body { background: var(--bg); font-family: 'Courier New', monospace; padding: 24px; color: var(--amber); }
  .card { max-width: 420px; margin: 0 auto; background: var(--surface); box-shadow: 0 0 0 2px var(--amber-dim) inset; padding: 20px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--amber-dim); }
  .tag { font-size:13px; letter-spacing:2px; padding:2px 6px; background: rgba(250,171,47,0.15); }
  .ver { font-size:12px; color: var(--text-muted); }
  .now { display:flex; justify-content:space-between; align-items:center; border:1px solid var(--amber-dim); padding:14px; margin-bottom:14px; }
  .now .temp { font-size:36px; }
  .now .desc { font-size:12px; color: var(--text-muted); text-align:right; letter-spacing:1px; }
  .now .desc .line { margin-bottom:2px; }
  .row5 { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; }
  .day { border:1px solid var(--amber-dim); padding:8px 4px; text-align:center; }
  .day .d { font-size:11px; color: var(--text-muted); }
  .day .t { font-size:15px; margin-top:6px; }
  .day .tmin { font-size:11px; color: var(--text-muted); }
  .alert { margin-top:12px; border:1px dashed var(--teal); color: var(--teal); font-size:12px; padding:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="tag">SYS.POGODA</span>
    <span class="ver">OPEN-METEO // 07:12</span>
  </div>

  <div class="now">
    <div class="temp">14&deg;</div>
    <div class="desc">
      <div class="line">ZACHMURZENIE 60%</div>
      <div class="line">WIATR 12 KM/H</div>
      <div class="line">ODCZUWALNA 12&deg;</div>
    </div>
  </div>

  <div class="row5">
    <div class="day"><div class="d">PON</div><div class="t">16&deg;</div><div class="tmin">9&deg;</div></div>
    <div class="day"><div class="d">WT</div><div class="t">15&deg;</div><div class="tmin">8&deg;</div></div>
    <div class="day"><div class="d">SR</div><div class="t">13&deg;</div><div class="tmin">7&deg;</div></div>
    <div class="day"><div class="d">CZW</div><div class="t">14&deg;</div><div class="tmin">9&deg;</div></div>
    <div class="day"><div class="d">PT</div><div class="t">17&deg;</div><div class="tmin">10&deg;</div></div>
  </div>

  <div class="alert">&gt; UWAGA: opady po 16:00 — zabierz parasol</div>
</div>
</body>
</html>
