<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wireframe — HUD retro sci-fi (kierunek finalny)</title>
<style>
  :root {
    --bg: #1a1712; --surface: #211d16; --amber: #faab2f; --amber-dim: #ba7517;
    --teal: #5dcaa5; --text-muted: #888780;
  }
  body { background: var(--bg); font-family: 'Courier New', monospace; padding: 24px; color: var(--amber); }
  .card { max-width: 420px; margin: 0 auto; background: var(--surface); box-shadow: 0 0 0 2px var(--amber-dim) inset; padding: 20px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--amber-dim); }
  .head .tag { font-size:13px; letter-spacing:2px; padding:2px 6px; background: rgba(250,171,47,0.15); }
  .head .ver { font-size:12px; color: var(--text-muted); }
  .cursor { animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .row2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  .box { border:1px solid var(--amber-dim); padding:8px 10px; }
  .label { font-size:11px; color: var(--text-muted); letter-spacing:1px; }
  .big { font-size:22px; margin-top:4px; }
  .status { color: var(--teal); font-size:13px; padding-top:4px; }
  .log { border:1px solid var(--amber-dim); padding:10px; }
  .log .label { margin-bottom:8px; }
  .logrow { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .dim { color: var(--text-muted); }
  button { width:100%; margin-top:12px; font-family:inherit; font-size:13px; border:1px solid var(--amber-dim); background:transparent; color: var(--amber); padding:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="tag">SYS.KUCHNIA</span>
    <span class="ver">v0.1 // <span class="cursor">&#9608;</span></span>
  </div>
  <div class="row2">
    <div class="box"><div class="label">TEMP.ZEWN</div><div class="big">14°C</div></div>
    <div class="box"><div class="label">STATUS</div><div class="status">&#9679; ONLINE</div></div>
  </div>
  <div class="log">
    <div class="label">LOG.WYDARZENIA — CZW</div>
    <div class="logrow"><span>&gt; 12:00 obiad rodzinny</span><span>[AKTYWNE]</span></div>
    <div class="logrow dim"><span>&gt; 18:30 trening</span><span>[OCZEKUJE]</span></div>
  </div>
  <button>[ + NOWY WPIS ]</button>
</div>
</body>
</html>
