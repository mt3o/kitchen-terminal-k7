# The screen. Swapping the whole design is swapping `theme` — nothing else.
version: 1
theme: "design-system/themes/retro-scifi.yaml"

# The default grid. A page may override it.
grid:
  columns: 3
  gap: "12px"

# Ordered pages, swiped between. Each carries its own grid — a plain nested
# grid, not CSS `subgrid`, which is Safari 16 and past this project's floor.
#
# Cards get a whole page rather than being squeezed into one: adding a card
# should cost a page, not shrink the cards already on the wall.
pages:
  - id: glowna
    label: GLOWNA
    grid: { columns: 2 }
    cards:
      - id: zegar
        type: clock
        params:
          format: "24h"
          showDate: true
          showSeconds: false
          locale: "pl-PL"

      - id: pogoda
        type: weather
        refreshIntervalSeconds: 900
        params:
          location: { lat: 52.2297, lon: 21.0122, label: "Warszawa" }
          units: metric
          forecastDays: 5

      - id: zakupy
        type: shopping-list
        # A shopping list is read top to bottom and grows; sharing a column with
        # another card gives it four visible rows and a scrollbar. 0 = the whole
        # column, whatever the page's row count turns out to be.
        span: { rows: 0 }
        params:
          dataSource: { mode: local }
          groupByCategory: true

      - id: minutnik
        type: timer
        params:
          presetsMinutes: [1, 3, 5, 10, 15, 20, 30, 45, 60]

      # A slideshow entry is declared inside `cards` like any other card (the
      # schema's own KONTRAKT note explains why) but renders nothing in its
      # own slot — `span` is ignored on it — and instead takes over the whole
      # screen after a long silence. At most one is allowed per layout, and
      # `cardIds` may point anywhere: this one rotates across three different
      # pages to actually exercise that. `wakeOnPresence` is deliberately
      # left unset — camera-based wake is out of scope for this change.
      - id: pokaz-domowy
        type: slideshow
        params:
          idleTriggerSeconds: 1800
          intervalSeconds: 15
          cardIds: [zegar, pogoda, kalendarz, audiometr]
          transition: fade
          exitOnInteraction: true

  - id: dom
    label: DOM
    grid: { columns: 2 }
    cards:
      - id: kalendarz
        type: calendar
        params:
          calendarId: primary
          view: week
          editable: true

      - id: czat
        type: chat
        params:
          defaultModel: "kilo-auto/free"
          voiceInput: true

      - id: przepisy
        type: recipes
        params:
          maxVisible: 6
          allowUrlImport: true

      - id: komiks
        type: comic-of-the-day
        params:
          # Official Simon's Cat feed. Their own site (simonscat.com) has no
          # RSS; this Tumblr is the one official channel that still exposes
          # one — images arrive embedded in <description>, not enclosure/
          # media:content, which is exactly the firstImgSrc fallback path.
          rssUrl: "https://simonscat.tumblr.com/rss"
          cacheDurationHours: 24
          creditText: "Simon's Cat (simonscat.com)"
          linkToSource: true
          fallbackImageUrl: "https://64.media.tumblr.com/37a909135529ac75eed7f7eeed78a07e/0af04ab99beb43a3-ff/s500x750/19ada50379943b435bb91b46d9a1505bfd0fc332.jpg"

  - id: kuchnia
    label: KUCHNIA
    grid: { columns: 2 }
    cards:
      - id: audiometr
        type: audiometer
        params:
          historyDurationSeconds: 180
          sampleIntervalMs: 500
          unit: percent
          showCurrentLevel: true
          showHistogram: true
          smoothingFactor: 0.3
          warningThreshold: 75

      - id: minutnik-kuchnia
        type: timer
        params:
          presetsMinutes: [1, 2, 3, 5, 8, 10, 15, 20]

      - id: ascii
        type: ascii-art-of-the-day
        params:
          prompt: "kot w stylu ASCII art, klimat retro terminal"
          model: "kilo-auto/free"
          cacheDurationHours: 24

      - id: menu-kuchnia
        type: menu
        params:
          items:
            - { cardId: audiometr, label: AUDIO }
            - { cardId: minutnik-kuchnia, label: CZAS }

  - id: system
    label: SYSTEM
    grid: { columns: 2 }
    cards:
      - id: zegar-system
        type: clock
        params:
          format: "24h"
          showDate: true
          showSeconds: true
          locale: "pl-PL"

      - id: pogoda-system
        type: weather
        refreshIntervalSeconds: 1800
        params:
          location: { lat: 52.2297, lon: 21.0122, label: "Warszawa" }
          units: metric
          forecastDays: 5

      - id: karuzela
        type: carousel
        params:
          slides:
            - id: karuzela-zegar
              type: clock
              params: { format: "24h", showDate: false }
            - id: karuzela-pogoda
              type: weather
              params:
                location: { lat: 52.2297, lon: 21.0122 }

      - id: grid-wskazniki
        type: grid
        params:
          columns: 2
          cells:
            - id: wskaznik-zegar
              type: clock
              params: { format: "24h", showDate: false }

      # No daily rotation, no feed — just a picture, until the layout itself
      # is edited. Placeholder here; swap `url` for a real photo/artwork.
      - id: obraz
        type: image
        params:
          url: "https://placehold.co/600x400/png"
          caption: "obraz statyczny"

      # An "image carousel" is not its own card type — it is the existing
      # carousel with `type: image` slides, same recursion every other
      # container card type uses.
      - id: karuzela-zdjecia
        type: carousel
        params:
          autoAdvanceSeconds: 20
          slides:
            - id: zdjecie-1
              type: image
              params: { url: "https://placehold.co/600x400/png?text=1", caption: "zdjęcie 1" }
            - id: zdjecie-2
              type: image
              params: { url: "https://placehold.co/600x400/png?text=2", caption: "zdjęcie 2" }
