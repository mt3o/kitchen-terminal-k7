# The screen. Swapping the whole design is swapping `theme` — nothing else.
version: 1
theme: "design-system/themes/retro-scifi.yaml"

# The default grid. A page may override it.
grid:
  columns: 3
  gap: "12px"

# Every calendar card shows these, one tab each, in this order. Keyed by id —
# a map, not a list, so the gitignored layout.local.yaml adds a calendar (or
# changes one field of one below) by writing the same `calendars:` key; see
# layout.local.yaml.example. Up here rather than in a card's params because a
# card sits inside the `pages`/`cards` lists, which a layered merge can't
# reach into by id.
calendars:
  google-primary:
    name: "Google"
    source: { mode: google, calendarId: primary }
  # A public Google calendar — no reason to keep this one out of a public
  # repo, unlike the household's own calendars in layout.local.yaml.
  swieta:
    name: "Święta"
    source: { mode: google, calendarId: "pl.polish#holiday@group.v.calendar.google.com" }

# Which calendars the GŁÓWNY tab merges, by id. The rest get their own tab only.
mainCalendars: [google-primary, swieta]

# Ordered pages, swiped between. Each carries its own grid — a plain nested
# grid, not CSS `subgrid`, which is Safari 16 and past this project's floor.
#
# Cards get a whole page rather than being squeezed into one: adding a card
# should cost a page, not shrink the cards already on the wall.
#
# Reorganized 2026-09-17 around how the household actually uses the wall
# (previously grouped by rough theme — "dom", "kuchnia", "system" — rather
# than by use: the glance-at-a-distance essentials (time/weather/calendar)
# were split across two pages, two timers duplicated the same card on two
# pages, and `grid`/`menu` were each spent on a whole page slot for
# themselves — a nested single-clock grid and a bare audio/timer switcher —
# rather than used as the layout tools they are.
pages:
  # The one page read from the doorway: what time is it, what's the
  # weather, what's on the calendar today — plus the ascii-art-of-the-day
  # for warmth, since a wall display that is only ever utilitarian is a
  # worse one to live with.
  - id: glowna
    label: GLOWNA
    grid: { columns: 2 }
    cards:
      - id: zegar
        type: clock
        params:
          format: "24h"
          showDate: true
          showSeconds: false
          locale: "pl-PL"

      - id: pogoda
        type: weather
        refreshIntervalSeconds: 900
        params:
          location: { lat: 52.2297, lon: 21.0122, label: "Warszawa" }
          units: metric
          forecastDays: 5

      - id: kalendarz
        type: calendar
        params:
          view: week

      - id: ascii
        type: ascii-art-of-the-day
        params:
          prompt: "kot w stylu ASCII art, klimat retro terminal"
          model: "kilo-auto/free"
          cacheDurationHours: 24
          # Shown instead of "brak ascii-art" whenever the Kilo Gateway key
          # is not configured or the gateway is unreachable and nothing is
          # cached yet — a static stand-in, not a fix for either condition.
          fallbackArt: |
            /\_/\
            ( o.o )
            > ^ <

      # A slideshow entry is declared inside `cards` like any other card (the
      # schema's own KONTRAKT note explains why) but renders nothing in its
      # own slot — `span` is ignored on it — and instead takes over the whole
      # screen after a long silence. At most one is allowed per layout, and
      # `cardIds` may point anywhere: this one rotates across two different
      # pages to actually exercise that. `wakeOnPresence` is deliberately
      # left unset — camera-based wake is out of scope for this change.
      #
      # `audiometr` was dropped from this list when it moved behind
      # `menu-przepisy` (below): app.css's `.page [hidden] { display: none
      # !important }` beats `.k7-fullscreen-active`'s `position: fixed
      # !important`, and the menu leaves every non-active card `hidden` —
      # promoting a hidden card to "fullscreen" would just paint nothing for
      # its whole turn. `enterSlideshow`/`rotateSlideshow` in
      # fullscreen-lock.ts don't know about menu-owned visibility at all
      # (only the `k7-reveal`/`k7-menu-select` path does, and the Slideshow
      # never dispatches it) — teaching them to would be a bigger change than
      # this one warrants, so any *other* menu-hidden card must stay out of
      # `cardIds` too until that's fixed.
      - id: pokaz-domowy
        type: slideshow
        params:
          idleTriggerSeconds: 1800
          intervalSeconds: 15
          cardIds: [zegar, pogoda, kalendarz]
          transition: fade
          exitOnInteraction: true

  # A second, full-width look at the calendar — the same week view GLOWNA
  # shows in passing, but with the whole page's width for event titles
  # instead of a shared half of a 2x2 grid. Deliberately a second calendar
  # card instance rather than moving the one off GLOWNA: the doorway glance
  # still wants it there, this page is for actually reading the week.
  - id: kalendarz
    label: KALENDARZ
    grid: { columns: 1 }
    cards:
      - id: kalendarz-pelny
        type: calendar
        params:
          view: week

  # Recipes are the primary reason to open this page; chat, the timer and the
  # noise meter are further tabs away — one menu-switched page for everything
  # reached for while actually cooking, rather than a whole extra page (the
  # former NARZĘDZIA) just for the last two. None of these four need to be
  # seen from the doorway, which is what set them apart from GŁÓWNA/KALENDARZ.
  # 3 columns rather than 2: the content card (whichever tab is active) spans
  # 2 of them, the menu keeps the 3rd — a 2:1 split instead of an even half
  # for a tab strip that only ever needs to fit short labels. Works within
  # the grid's own equal-track model (no per-column width support exists —
  # see layout.schema.yaml `grid`) by spending `span.cols` rather than sizing
  # a track directly.
  - id: przepisy
    label: PRZEPISY
    grid: { columns: 3 }
    cards:
      - id: przepisy
        type: recipes
        span: { cols: 2 }
        params:
          maxVisible: 6
          allowUrlImport: true

      - id: czat
        type: chat
        span: { cols: 2 }
        params:
          defaultModel: "kilo-auto/free"
          voiceInput: true

      - id: minutnik
        type: timer
        span: { cols: 2 }
        params:
          presetsMinutes: [1, 3, 5, 10, 15, 20, 30, 45, 60]

      - id: audiometr
        type: audiometer
        span: { cols: 2 }
        params:
          historyDurationSeconds: 180
          sampleIntervalMs: 500
          unit: percent
          showCurrentLevel: true
          showHistogram: true
          smoothingFactor: 0.3
          warningThreshold: 75

      - id: menu-przepisy
        type: menu
        params:
          # Vertical fits the narrow 1-of-3 column it now owns better than
          # horizontal did in the old even split, and scales to 4 items
          # without wrapping into a second row the way horizontal would.
          orientation: vertical
          style: tabs
          defaultActive: przepisy
          items:
            - { cardId: przepisy, label: PRZEPISY }
            - { cardId: czat, label: CZAT }
            - { cardId: minutnik, label: MINUTNIK }
            - { cardId: audiometr, label: AUDIOMETR }

  # A shopping list is read top to bottom and grows; on its own page it gets
  # the whole page height rather than sharing a column and a scrollbar.
  - id: zakupy
    label: ZAKUPY
    grid: { columns: 1 }
    cards:
      - id: zakupy
        type: shopping-list
        params:
          dataSource: { mode: local }
          groupByCategory: true

  # The just-for-fun page: the Punktomat login QR (a practical, frequently
  # scanned thing) alongside a rotating carousel of cat photos.
  - id: punktomat
    label: PUNKTOMAT
    grid: { columns: 2 }
    cards:
      # No daily rotation, no feed — just a picture, until the layout itself
      # is edited. Served from public/ rather than an external host: a login
      # QR code is exactly the kind of image that should not depend on a
      # third party staying up.
      - id: obraz
        type: image
        params:
          url: "/punktomat-login-qr.jpg"
          label: "Punktomat Login QR code"
          caption: "zeskanuj, aby się zalogować"

      # Photos from the Unsplash API, fetched server-side with K7_UNSPLASH_ACCESS_KEY.
      # A fresh random set every cacheDurationHours, attribution included.
      - id: karuzela-zdjecia
        type: unsplash-carousel
        params:
          query: "cat"
          orientation: landscape
          count: 15
          autoAdvanceSeconds: 20
          cacheDurationHours: 6

  # The daily comic gets its own page rather than sharing with recipes/chat
  # or the fun page — one thing to check, once a day.
  - id: komiks
    label: KOMIKS
    grid: { columns: 1 }
    cards:
      - id: komiks
        type: comic-of-the-day
        params:
          # Official Simon's Cat feed. Their own site (simonscat.com) has no
          # RSS; this Tumblr is the one official channel that still exposes
          # one — images arrive embedded in <description>, not enclosure/
          # media:content, which is exactly the firstImgSrc fallback path.
          rssUrl: "https://simonscat.tumblr.com/rss"
          cacheDurationHours: 24
          creditText: "Simon's Cat (simonscat.com)"
          linkToSource: true
          fallbackImageUrl: "https://64.media.tumblr.com/37a909135529ac75eed7f7eeed78a07e/0af04ab99beb43a3-ff/s500x750/19ada50379943b435bb91b46d9a1505bfd0fc332.jpg"
