<!doctype html>
<html lang="pl" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K7">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#faab2f">
<title>Kitchen Terminal K7</title>
<!-- The token sheet, generated from the theme file layout.yaml names. A <link>
     rather than a bundled import so that swapping the theme is a server-side
     fact, and so the sheet is present before first paint. -->
<link rel="stylesheet" href="/theme.css">
<!-- iOS ignores the manifest's icons and has no notion of a splash from it
     either: a home-screen launch shows a white flash unless an explicit startup
     image is given per orientation. Letterboxed onto the theme background so the
     launch and the app that follows it are the same colour. -->
<link rel="apple-touch-startup-image" media="(orientation: landscape)" href="/splash-2048x1536.png">
<link rel="apple-touch-startup-image" media="(orientation: portrait)" href="/splash-1536x2048.png">
</head>
<body>
  <div class="shell">
    <header class="shell-head">
      <span class="hud-label">TERMINAL K7</span>
      <span class="shell-status">
        <button type="button" id="changelog-open" class="hud-button" aria-haspopup="dialog" aria-controls="changelog">[ i ] DZIENNIK ZMIAN</button>
        <span class="hud-label" id="status">STATUS: BOOT</span>
        <span class="cursor" aria-hidden="true">&#9608;</span>
      </span>
    </header>
    <main id="deck" class="deck" aria-live="polite"></main>
    <footer class="shell-foot">
      <span class="meta" id="foot">&gt; ladowanie layoutu</span>
      <button type="button" id="theme-toggle" class="hud-button">[ MOTYW: JASNY ]</button>
    </footer>
    <div
      id="reconnect"
      hidden
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="reconnect-title"
      aria-describedby="reconnect-detail"
    >
      <div class="reconnect-veil" aria-hidden="true"></div>
      <div class="reconnect-panel">
        <p class="reconnect-badge" aria-hidden="true">[!]</p>
        <h2 id="reconnect-title" class="reconnect-title">POŁĄCZENIE UTRACONE</h2>
        <p id="reconnect-detail" class="reconnect-detail">serwer nie odpowiada</p>
        <p class="reconnect-line">
          <span id="reconnect-attempt" class="meta">próba 1</span>
          <span id="reconnect-countdown" class="meta">ponowna próba za 5 s</span>
        </p>
        <div id="reconnect-bar" class="reconnect-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="reconnect-bar-fill" class="reconnect-bar-fill" style="width: 0%"></div>
        </div>
      </div>
    </div>
    <div
      id="changelog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="changelog-title"
    >
      <div class="changelog-veil" aria-hidden="true"></div>
      <div class="changelog-panel">
        <header class="changelog-head">
          <h2 id="changelog-title" class="changelog-title">DZIENNIK ZMIAN</h2>
          <button type="button" id="changelog-close" class="hud-button" aria-label="zamknij">[ x ]</button>
        </header>
        <div id="changelog-body" class="changelog-body">
          <p class="meta">wczytywanie…</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
